[project]
name = "food_catalyst"
version = "0.1.0"
description = "Food Catalyst using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.152.0,<1.0.0",
    "streamlit",
    "pysqlite3-binary",
]

[project.scripts]
food_catalyst = "food_catalyst.main:run"
run_crew = "food_catalyst.main:run"
train = "food_catalyst.main:train"
replay = "food_catalyst.main:replay"
test = "food_catalyst.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
